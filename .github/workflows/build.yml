name: Build APKs

# Manual only: rebuilding Shutter Bridge creates APKs with a new signing key,
# and the phone and watch apps must come from the same run.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both APKs
        run: chmod +x gradlew && ./gradlew :phone:assembleDebug :wear:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shutterbridge-apks
          path: |
            phone/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
