name: Build IR Finder

on:
  workflow_dispatch:
  push:
    paths:
      - 'irfinder/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-irfinder.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run encoder tests and build the APK
        run: chmod +x gradlew && ./gradlew :irfinder:testDebugUnitTest :irfinder:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: irfinder-apk
          path: irfinder/build/outputs/apk/debug/*.apk
      - name: Publish a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "irfinder-run${{ github.run_number }}" \
            irfinder/build/outputs/apk/debug/irfinder-debug.apk \
            --title "IR Finder build ${{ github.run_number }}" \
            --notes "Debug build of the IR Finder Android app (commit ${{ github.sha }}). Encoder unit tests passed in this run."
